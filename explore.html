
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Explore</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/mobile.css">
</head>
<body>
<!-- Navigasi -->
    <nav class="navbar">
        <a href="home.html">
        <div class="logo">
            <img src="../img/logo_depmusic.png" alt="DepMusic">
                <span>DepMusic</span>
        </div>
        </a>
        <div class="nav-menu">
            <a href="home.html">Home</a>
            <a href="explore.html" class="active">Explore</a>
            <a href="player.html">Player</a>
        </div>
        <div class="search">
            <img src="../img/Kaca_pembesar.png" alt="Search">
        </div>

        <button class="hamburger" type="button">☰</button>
    </nav>

    <!-- navigasi mobile-->
     <div class="mobile-menu">
        <a href="home.html">Home</a>
        <a href="explore.html">Explore</a>
        <a href="player.html">Player</a>
    </div>


    <!-- section  -->
    <section class="explore-section">
        <div class="explore-title">
            <h1>Explore Music</h1>
            <p>Find songs that match your mood.</p>
        </div>
    <!-- search -->
        <div class="search-box">
            <p>🔍︎</p>
            <input 
            type="text"
            id="search-input"
            placeholder="Search song or artist...">
        </div>

        <!-- filter mood -->
        <div class="mood-filter">
            <button class="filter-button active" data-mood="All">
                All
            </button>
            <button class="filter-button" data-mood="Energy">
                Energy
            </button>
            <button class="filter-button" data-mood="Sad">
                Sad
            </button>
            <button class="filter-button" data-mood="Chill">
                Chill
            </button>
        </div>

        <!-- All music -->
            <div class="explore-song-container" id="explore-song-container">

            </div>
        </section>
    </section>
    
    <script src="../js/songs.js"></script>
    <script src="../js/explore.js"></script>
    <script src="../js/mobile.js"></script>

</body>
</html>
